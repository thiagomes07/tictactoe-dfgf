services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dfgf-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AWS_REGION: "us-east-1"
      BEDROCK_ENABLED: "true"
      BEDROCK_MODEL_ID: "${BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-4-20250514-v1:0}"
      BEDROCK_REQUEST_TIMEOUT_MS: "${BEDROCK_REQUEST_TIMEOUT_MS:-25000}"
      AI_MOVE_DELAY_MIN_MS: "${AI_MOVE_DELAY_MIN_MS:-800}"
      AI_MOVE_DELAY_MAX_MS: "${AI_MOVE_DELAY_MAX_MS:-1800}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "1"
    volumes:
      - type: bind
        source: ${USERPROFILE:-/tmp}/.aws
        target: /root/.aws
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dfgf-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8080"
      NEXT_PUBLIC_BACKEND_PORT: "8080"
      NODE_ENV: "production"
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
