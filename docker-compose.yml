services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dfgf-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dfgf-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8080"
      NODE_ENV: "production"
      PORT: "3000"
